<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Online test</title>
<style>
:root{--ink:#14202e;--ink2:#465a72;--line:#d5dde7;--bg:#f3f6fa;--card:#fff;--brand:#1b3a5c;--brand2:#e9f0f8;--ok:#1f7a4d;--bad:#b42318;--warn:#b54708;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}.muted{color:var(--ink2)}.xs{font-size:13px}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #1b3a5c22}.multi-note{font-size:13px;color:var(--muted);margin:2px 0 8px}.opt .l.box{border-radius:5px}.fibin{width:100%;max-width:420px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
textarea{min-height:120px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:46px;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.block{width:100%}.btn:disabled{opacity:.55;cursor:default}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;box-shadow:0 2px 8px #0002}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .t{flex:1;min-width:0}.top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .t span{font-size:13px;opacity:.85}
.clock{font:700 22px/1 ui-monospace,Consolas,monospace;background:#ffffff22;border-radius:10px;padding:8px 12px;min-width:96px;text-align:center}
.clock.low{background:#b42318}
.saved{font-size:12px;opacity:.85;min-width:58px;text-align:right}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.pal a{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.pal a.done{background:var(--brand2);border-color:var(--brand);color:var(--brand)}
.q{scroll-margin-top:84px}.q .qh{display:flex;gap:10px;align-items:baseline}.q .qn{font-weight:700;min-width:30px}
.q .qt{white-space:pre-wrap}.q .qt .ln{display:block}.q .qt .ln.sp{margin-top:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:8px 0 0;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink);cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.on{border-color:var(--brand);background:var(--brand2)}.opt.on .l{background:var(--brand);border-color:var(--brand);color:#fff}
.sub{margin-top:12px}.sub label{margin:8px 0 4px;font-size:14px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.photos .ph{position:relative;font-size:13px;background:var(--brand2);border-radius:8px;padding:6px 30px 6px 10px}
.photos .ph button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer;color:var(--bad)}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.parts .p{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.parts .p:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--brand2);color:var(--brand)}
.tag.ok{background:#e3f4ea;color:var(--ok)}
ol.ins{margin:8px 0 0 20px;padding:0}ol.ins li{margin:4px 0}
.ins-note{margin:8px 4px 0;color:#475569;font-size:13px}
.secure{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.secure textarea{-webkit-user-select:text;user-select:text}
.wm{position:fixed;inset:0;pointer-events:none;z-index:3;background-repeat:repeat;opacity:.13}
.shield .wrap{filter:blur(14px);pointer-events:none}
.shieldmsg{display:none;position:fixed;inset:0;z-index:9;place-items:center;text-align:center;padding:24px;font-weight:700;color:var(--brand)}
.shield .shieldmsg{display:grid}
.busy{position:fixed;inset:0;z-index:10;background:#0b1e37cc;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.sechead{font-size:17px;font-weight:700;color:var(--brand);margin:20px 4px 8px}
@media print{body{display:none}}
.warnbar{position:sticky;top:62px;z-index:4;background:#b42318;color:#fff;text-align:center;font-weight:700;padding:8px 12px}
.notice{background:#e3f4ea;border:1px solid #9fd3b5;color:#14532d;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-weight:600}
.startbox{text-align:center;padding:10px 0}.startbox .big{font:700 30px/1.2 ui-monospace,Consolas,monospace;color:var(--brand);margin:6px 0}
.tag.miss{background:#fdecea;color:var(--bad)}
.banner{background:#fff4e5;border:1px solid #f5c26b;color:#7a4b00;border-radius:10px;padding:10px 14px;margin:0 0 14px}
@media (max-width:520px){.wrap{padding:12px}.card{padding:14px}.clock{font-size:19px;min-width:84px;padding:7px 9px}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card">Loading…</div></div></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>');
const SUB = /^\s*(?:\(?[A-Za-z]\)|[A-Za-z][.)]|\(?(?:i|ii|iii|iv|v|vi)\)|(?:i|ii|iii|iv|v|vi)[.)])\s+\S/i;
const qtext = t => String(t || '').split('\n').map((l, k) => `<span class="ln${k && SUB.test(l) ? ' sp' : ''}">${rich(l) || '&nbsp;'}</span>`).join('');
const params = new URLSearchParams(location.search);
const KEY = 'qpr-online-token';
const linkCode = String(params.get('c') || '').trim().toUpperCase();
const keyFor = code => KEY + ':' + String(code || '').trim().toUpperCase();
let token = null, me = null, offset = 0, curPart = -1, tick = null, pending = new Map(), sending = false, lastSaved = 0, notice = '', warned = {};
/* the phone remembers each test separately, so a new link never reopens an earlier test */
try { token = linkCode ? localStorage.getItem(keyFor(linkCode)) : null; localStorage.removeItem(KEY); } catch (e) {}
function forget() { try { if (me && me.code) localStorage.removeItem(keyFor(me.code)); if (linkCode) localStorage.removeItem(keyFor(linkCode)); } catch (e) {} token = null; me = null; }

async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong.'); e.status = r.status; throw e; }
  return j;
}
const serverNow = () => Date.now() + offset;
const hhmm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmt = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0'); };

/* ---------- join ---------- */
function showJoin(msg) {
  clearInterval(tick);
  $('#app').innerHTML = `<div class="wrap"><div class="card"><h1>Online test</h1><p class="muted">Enter your details and the session code given by the invigilator.</p>
    <label for="n">Name</label><input type="text" id="n" autocomplete="name">
    <label for="i">IGA</label><input type="text" id="i" autocomplete="off" autocapitalize="characters">
    <label for="c">Session code</label><input type="text" id="c" autocomplete="off" autocapitalize="characters" value="${esc(params.get('c') || '')}">
    <div style="margin-top:18px"><button class="btn primary block" id="go">Start</button></div>${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <p class="xs muted" style="margin-top:14px">If you get disconnected, open the same link and enter the same IGA: you continue where you were.</p></div></div>`;
  $('#go').onclick = async () => {
    const b = { name: $('#n').value, iga: $('#i').value, code: $('#c').value };
    $('#go').disabled = true;
    try { const r = await api('/api/join', b); token = r.token; try { localStorage.setItem(keyFor(b.code), token); } catch (e) {} load(); }
    catch (e) { showJoin(e.message); $('#n').value = b.name; $('#i').value = b.iga; $('#c').value = b.code; }
  };
}

/* ---------- state ---------- */
async function load() {
  try { me = await api('/api/me'); offset = me.now - Date.now(); }
  catch (e) { if (e.status === 401) { forget(); return showJoin(); } return showError(e.message); }
  if (linkCode && me.code && me.code !== linkCode) { forget(); return showJoin(); }
  const k = me.parts.findIndex(p => p.state === 'in progress');
  if (k >= 0) return showPart(k);
  showLobby();
}
function showError(msg) { $('#app').innerHTML = `<div class="wrap"><div class="card"><h2>Connection problem</h2><p>${esc(msg)}</p><button class="btn primary" onclick="load()">Try again</button></div></div>`; }

function showLobby() {
  clearInterval(tick); curPart = -1; protect(false);
  const done = p => p.submitted || p.state === 'time up' || p.state === 'missed';
  const next = me.parts.findIndex(p => !done(p));
  const allDone = next < 0;
  const before = me.startAt && serverNow() < me.startAt;
  const np = next >= 0 ? me.parts[next] : null;
  const tagOf = (p, k) => p.state === 'missed' ? '<span class="tag miss">Missed</span>' : p.auto ? '<span class="tag ok">Submitted automatically</span>' : done(p) ? '<span class="tag ok">Submitted</span>' : k === next ? '<span class="tag">Next</span>' : '<span class="tag">Later</span>';
  $('#app').innerHTML = `<div class="wrap"><div class="card"><h1>${esc(me.title)}</h1><p class="muted">${esc(me.name)} · IGA ${esc(me.iga)}${me.set ? ' · Set ' + esc(me.set) : ''}</p></div>
    ${notice ? `<div class="notice">${esc(notice)}</div>` : ''}
    ${me.closed ? '<div class="banner">This session has been closed by the invigilator.</div>' : ''}
    ${me.parts.every(p => p.state === 'not started') || me.parts.every(done) ? `<p class="xs" style="margin:-4px 4px 12px"><a href="#" id="notme">Not ${esc(me.name)}, or a different test? Sign out</a></p>` : ''}
    <div class="card parts">${me.parts.map((p, k) => `<div class="p"><div><b>${esc(p.name)}</b><div class="xs muted">${p.minutes} minutes${p.kind ? ' · ' + esc(p.kind) : ''}${p.windowEnd ? ' · ends at ' + hhmm(p.windowEnd) : ''}</div></div>${tagOf(p, k)}</div>`).join('')}</div>
    ${allDone ? `<div class="card"><h2>Thank you</h2><p>Your answers have been submitted. You may close this page.</p></div>` :
      `<div class="card"><h2>${esc(np.name)}</h2>
      ${before ? `<div class="startbox"><div class="muted">The test starts at <b>${hhmm(me.startAt)}</b></div><div class="big" id="cd">--:--</div><div class="xs muted">The Start button opens by itself at the start time.</div></div>` :
        `<p class="muted">${me.fixed && np.windowEnd ? `This part ends at <b>${hhmm(np.windowEnd)}</b> for everyone.` : `${np.minutes} minutes. The time starts when you press Start and keeps running even if you close the page.`} Your answers are submitted automatically when the time is over.</p>`}
      ${np.instructions.length ? (() => { const isNote = t => /^\s*(?:\d+[.)]\s*)?(?:[-*•]\s*)?(?:\*\*|__)?\s*(?:disclaimer|note|n\.?\s?b\.?)\b/i.test(String(t||'')); const nums = np.instructions.filter(t=>!isNote(t)), notes = np.instructions.filter(isNote); const al = (np.insAlign==='center'||np.insAlign==='right'||np.insAlign==='justify')?np.insAlign:'left'; return `<div style="text-align:${al}">${nums.length ? `<b>Instructions</b><ol class="ins"${al!=='left'?' style="list-style-position:inside;margin-left:0"':''}>${nums.map(t => `<li>${rich(t)}</li>`).join('')}</ol>` : ''}${notes.map(t => `<p class="ins-note">${rich(t)}</p>`).join('')}</div>`; })() : ''}
      <div style="margin-top:16px"><button class="btn primary block" id="start" ${me.closed || before ? 'disabled' : ''}>Start ${esc(np.name)}</button></div></div>`}</div>`;
  const nm = $('#notme'); if (nm) nm.onclick = e => { e.preventDefault(); forget(); showJoin(); };
  const b = $('#start'); if (b) b.onclick = async () => { b.disabled = true; notice = ''; try { await api('/api/start', { part: next }); await load(); } catch (e) { alert(e.message); b.disabled = false; } };
  /* before the start time: count down, then open the Start button */
  if (before) tick = setInterval(() => { const left = me.startAt - serverNow(), cd = $('#cd'); if (cd) cd.textContent = fmt(left); if (left <= 0) { clearInterval(tick); load(); } }, 500);
}

/* ---------- a part ---------- */
const answered = (q) => { const v = me.answers[q.qid]; if (Array.isArray(v)) return v.length > 0; return v !== undefined && v !== null && v !== '' && !(typeof v === 'object' && !Object.values(v).some(x => String(x).trim())); };
function showPart(k) {
  curPart = k; const p = me.parts[k], qs = p.questions || [];
  $('#app').innerHTML = `<div class="top"><div class="in"><div class="t"><b>${esc(p.name)}</b><span>${esc(me.name)}${me.set ? ' · Set ' + esc(me.set) : ''}</span></div><div class="saved" id="saved"></div><div class="clock" id="clock">--:--</div></div></div>
    <div class="wrap">
      ${p.docs.length ? `<div class="card"><b>Reference documents</b><div class="docs" style="margin-top:8px">${p.docs.map(d => `<a class="btn sm" target="_blank" rel="noopener" href="/api/doc/${encodeURIComponent(d.id)}?t=${encodeURIComponent(token)}">${esc(d.name)}</a>`).join('')}</div></div>` : ''}
      <div class="card"><b>Questions</b><div class="pal" id="pal">${qs.map((q, i) => `<a href="#q${i}" class="${answered(q) ? 'done' : ''}" data-q="${esc(q.qid)}">${i + 1}</a>`).join('')}</div></div>
      ${qs.map((q, i) => (q.head && (i === 0 || qs[i - 1].head !== q.head) ? `<div class="sechead">${esc(q.head)}</div>` : '') + qHTML(q, i)).join('')}
      <div class="card foot"><span class="muted xs" id="cnt"></span><button class="btn primary" id="submit">Submit ${esc(p.name)}</button></div>
    </div>`;
  qs.forEach((q, i) => bindQ(q, i));
  protect(true);
  $('#submit').onclick = async () => {
    const left = qs.filter(q => !answered(q)).length;
    if (!confirm(left ? `${left} question(s) are not answered. Submit ${p.name} anyway? You cannot come back to it.` : `Submit ${p.name}? You cannot come back to it.`)) return;
    $('#submit').disabled = true; notice = `${p.name} has been submitted.`; await submitPart(k);
  };
  count(); clearInterval(tick); tick = setInterval(clock, 500); clock();
}
function qHTML(q, i) {
  const v = me.answers[q.qid];
  let body = '';
  if (q.type === 'obj' && q.multi) { const arr = Array.isArray(v) ? v : []; body = '<div class="multi-note">Choose all that apply.</div>' + q.options.map((o, j) => `<button class="opt ${arr.includes(o.i) ? 'on' : ''}" data-q="${esc(q.qid)}" data-i="${o.i}" data-multi="1"><span class="l box">${'ABCDEFGH'[j]}</span><span>${rich(o.t)}</span></button>`).join(''); }
  else if (q.type === 'obj') body = q.options.map((o, j) => `<button class="opt ${v === o.i ? 'on' : ''}" data-q="${esc(q.qid)}" data-i="${o.i}"><span class="l">${'ABCDEFGH'[j]}</span><span>${rich(o.t)}</span></button>`).join('');
  else if (q.type === 'fib') body = `<div class="sub"><input type="text" class="fibin" data-q="${esc(q.qid)}" value="${esc(typeof v === 'string' ? v : '')}" placeholder="Type your answer" autocomplete="off"></div>`;
  else {
    const rows = q.rows && q.rows.length ? q.rows : null, obj = v && typeof v === 'object' ? v : {};
    body = rows ? rows.map(r => `<div class="sub"><label for="t_${esc(q.qid)}_${esc(r)}">${esc(r)}</label><textarea id="t_${esc(q.qid)}_${esc(r)}" data-q="${esc(q.qid)}" data-r="${esc(r)}" rows="4">${esc(obj[r] || '')}</textarea></div>`).join('')
      : `<div class="sub"><textarea data-q="${esc(q.qid)}" rows="6" aria-label="Your answer">${esc(typeof v === 'string' ? v : '')}</textarea></div>`;
    body += `<div class="photos" id="ph_${esc(q.qid)}">${photosHTML(q.qid)}</div>`;
  }
  return `<div class="card q" id="q${i}"><div class="qh"><span class="qn">${esc(q.no || i + 1)}.</span><div class="qt">${qtext(q.text)}</div></div>${body}</div>`;
}
function photosHTML(qid) {
  const l = (me.uploads && me.uploads[qid]) || [];
  return l.map((x, j) => `<span class="ph">${esc(x.name)}<button data-un="${esc(qid)}" data-j="${j}" aria-label="Remove">×</button></span>`).join('') +
    `<label class="btn sm" style="margin:0">Add photo of working<input type="file" accept="image/*" capture="environment" data-up="${esc(qid)}" hidden></label>`;
}
function bindQ(q) {
  if (q.type === 'obj' && q.multi) document.querySelectorAll(`.opt[data-q="${CSS.escape(q.qid)}"]`).forEach(b => b.onclick = () => {
    const i = +b.dataset.i; let arr = Array.isArray(me.answers[q.qid]) ? me.answers[q.qid].slice() : [];
    const at = arr.indexOf(i); if (at >= 0) arr.splice(at, 1); else arr.push(i); arr.sort((a, b) => a - b);
    me.answers[q.qid] = arr;
    document.querySelectorAll(`.opt[data-q="${CSS.escape(q.qid)}"]`).forEach(x => x.classList.toggle('on', arr.includes(+x.dataset.i)));
    queue(q.qid, arr); mark(q);
  });
  else if (q.type === 'obj') document.querySelectorAll(`.opt[data-q="${CSS.escape(q.qid)}"]`).forEach(b => b.onclick = () => {
    const i = +b.dataset.i, cur = me.answers[q.qid];
    me.answers[q.qid] = cur === i ? null : i;
    document.querySelectorAll(`.opt[data-q="${CSS.escape(q.qid)}"]`).forEach(x => x.classList.toggle('on', +x.dataset.i === me.answers[q.qid]));
    queue(q.qid, me.answers[q.qid]); mark(q);
  });
  else if (q.type === 'fib') { const inp = document.querySelector(`input.fibin[data-q="${CSS.escape(q.qid)}"]`); if (inp) inp.oninput = () => { me.answers[q.qid] = inp.value; queue(q.qid, inp.value); mark(q); }; }
  else {
    document.querySelectorAll(`textarea[data-q="${CSS.escape(q.qid)}"]`).forEach(t => t.oninput = () => {
      if (t.dataset.r) { const o = Object.assign({}, typeof me.answers[q.qid] === 'object' && me.answers[q.qid] ? me.answers[q.qid] : {}); o[t.dataset.r] = t.value; me.answers[q.qid] = o; }
      else me.answers[q.qid] = t.value;
      queue(q.qid, me.answers[q.qid]); mark(q);
    });
    bindPhotos(q.qid);
  }
}
function bindPhotos(qid) {
  const box = $('#ph_' + CSS.escape(qid)); if (!box) return;
  box.querySelectorAll('[data-up]').forEach(inp => inp.onchange = async () => {
    picking = false;
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
    try { const b64 = await shrink(f); setSaved('Uploading…'); await api('/api/upload', { part: curPart, qid, name: f.name || 'photo.jpg', mime: 'image/jpeg', b64 });
      (me.uploads[qid] = me.uploads[qid] || []).push({ name: f.name || 'photo.jpg' }); box.innerHTML = photosHTML(qid); bindPhotos(qid); setSaved('Saved'); }
    catch (e) { alert(e.message); setSaved(''); }
  });
  box.querySelectorAll('[data-un]').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this photo?')) return;
    try { await api('/api/unupload', { part: curPart, qid, index: +b.dataset.j }); me.uploads[qid].splice(+b.dataset.j, 1); box.innerHTML = photosHTML(qid); bindPhotos(qid); } catch (e) { alert(e.message); }
  });
}
/* photos are made smaller on the device before sending */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1]); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a picture this device can read.')); };
    img.src = url;
  });
}
function mark(q) { const a = document.querySelector(`#pal a[data-q="${CSS.escape(q.qid)}"]`); if (a) a.classList.toggle('done', answered(q)); count(); }
function count() { const qs = me.parts[curPart].questions || []; const n = qs.filter(answered).length; const c = $('#cnt'); if (c) c.textContent = `${n} of ${qs.length} answered`; }

/* ---------- saving: every answer is sent at once; failed sends are retried ---------- */
function setSaved(t) { const s = $('#saved'); if (s) s.textContent = t; }
function queue(qid, value) { pending.set(qid, { part: curPart, qid, value }); setSaved('Saving…'); clearTimeout(queue.t); queue.t = setTimeout(flushNow, 400); }
async function flushNow() {
  if (sending || !pending.size) return; sending = true;
  try {
    while (pending.size) {
      const batch = [...pending.values()];
      try { await api('/api/answers', { part: batch[0].part, items: batch.map(x => ({ qid: x.qid, value: x.value })) }); batch.forEach(x => { if (pending.get(x.qid) === x) pending.delete(x.qid); }); }
      catch (e) { if (e.status === 409) { pending.clear(); break; } throw e; }
    }
    lastSaved = Date.now(); setSaved('Saved');
  } catch (e) { setSaved('Offline – retrying'); setTimeout(flushNow, 3000); }
  finally { sending = false; }
}
/* Submit sends the unsaved answers with it: one request */
function busy(on, text) { let b = $('#busy'); if (on) { if (!b) { b = document.createElement('div'); b.id = 'busy'; b.className = 'busy'; document.body.appendChild(b); } b.textContent = text || 'Submitting…'; } else if (b) b.remove(); }
async function submitPart(k, auto) {
  clearTimeout(queue.t); busy(true, auto ? 'Time is over – submitting your answers…' : 'Submitting…');
  const items = [...pending.values()].filter(x => x.part === k).map(x => ({ qid: x.qid, value: x.value }));
  for (let tries = 0; tries < 4; tries++) {
    try { await api('/api/submit', { part: k, items, auto: !!auto }); pending.clear(); break; }
    catch (e) { if (e.status && e.status < 500) { pending.clear(); break; } busy(true, 'Connection problem – trying again…'); await new Promise(r => setTimeout(r, 2000)); }
  }
  busy(false); await load();
}
async function clock() {
  const p = me.parts[curPart]; if (!p) return;
  const left = p.deadline - serverNow(), c = $('#clock');
  if (c) { c.textContent = fmt(left); c.classList.toggle('low', left < 5 * 60000); }
  for (const mins of [5, 1]) if (left > 0 && left <= mins * 60000 && !warned[curPart + ':' + mins]) {
    warned[curPart + ':' + mins] = true;
    let w = $('#warnbar'); if (!w) { w = document.createElement('div'); w.id = 'warnbar'; w.className = 'warnbar'; const top = document.querySelector('.top'); if (top) top.after(w); }
    w.textContent = `${mins === 1 ? '1 minute' : mins + ' minutes'} left. Your answers will be submitted automatically at the end.`;
    if (navigator.vibrate) try { navigator.vibrate(300); } catch (e) {}
  }
  if (left <= 0) { clearInterval(tick); const k = curPart; notice = `${p.name}: the time is over. Your answers have been submitted automatically.`; await submitPart(k, true); }
}
/* ---------- screenshots and copying: a web page cannot block the phone's screenshot button, so the
   questions carry the candidate's name, blur when the page loses focus, and alerts reach the invigilator ---------- */
let picking = false;
function watermark() {
  const txt = `${me.name} · ${me.iga} · ${new Date().toLocaleDateString()}`.replace(/[<&>"]/g, '');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='200'><text x='10' y='120' transform='rotate(-24 180 100)' font-family='Arial' font-size='15' font-weight='700' fill='%231b3a5c'>${encodeURIComponent(txt)}</text></svg>`;
  return `url("data:image/svg+xml;utf8,${svg}")`;
}
function protect(on) {
  document.body.classList.toggle('secure', on);
  let w = $('#wm'), s = $('#shieldmsg');
  if (on) {
    if (!w) { w = document.createElement('div'); w.id = 'wm'; w.className = 'wm'; document.body.appendChild(w); }
    w.style.backgroundImage = watermark();
    if (!s) { s = document.createElement('div'); s.id = 'shieldmsg'; s.className = 'shieldmsg'; s.textContent = 'The questions are hidden while you are away from the test. Tap here to continue.'; document.body.appendChild(s); s.onclick = () => document.body.classList.remove('shield'); }
  } else { if (w) w.remove(); document.body.classList.remove('shield'); }
}
const alertInv = type => { if (token && curPart >= 0) api('/api/event', { type }).catch(() => {}); };
['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => {
  if (curPart >= 0 && !(e.target && e.target.tagName === 'TEXTAREA' && ev !== 'contextmenu')) e.preventDefault();
}));
window.addEventListener('blur', () => { if (curPart >= 0 && !picking) document.body.classList.add('shield'); });
window.addEventListener('focus', () => { setTimeout(() => document.body.classList.remove('shield'), 150); });
document.addEventListener('keydown', e => {
  if (curPart < 0) return;
  const k = (e.key || '').toLowerCase();
  if (k === 'printscreen' || (e.metaKey && e.shiftKey && /[345s]/.test(k)) || ((e.ctrlKey || e.metaKey) && /^[pcsu]$/.test(k) && !(e.target && e.target.tagName === 'TEXTAREA' && k === 'c'))) {
    e.preventDefault(); document.body.classList.add('shield');
    if (k === 'printscreen' || e.shiftKey) { alertInv('screenshot-key'); try { navigator.clipboard.writeText(''); } catch (x) {} }
  }
});
document.addEventListener('keyup', e => { if ((e.key || '').toLowerCase() === 'printscreen' && curPart >= 0) { alertInv('screenshot-key'); document.body.classList.add('shield'); try { navigator.clipboard.writeText(''); } catch (x) {} } });
document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('label') && e.target.closest('.photos')) { picking = true; setTimeout(() => { picking = false; }, 60000); } }, true);

/* the invigilator sees when a candidate leaves the test page */
document.addEventListener('visibilitychange', () => {
  if (token && curPart >= 0) {
    if (document.hidden) { if (!picking) { document.body.classList.add('shield'); api('/api/event', { type: 'left' }).catch(() => {}); } }
    else { api('/api/event', { type: 'back' }).catch(() => {}); flushNow(); }
  }
});
window.addEventListener('beforeunload', e => { if (pending.size) { e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { if (curPart >= 0 && !pending.size) api('/api/me').then(m => { const p = m.parts[curPart]; if (p) { me.parts[curPart].deadline = p.deadline; me.parts[curPart].minutes = p.minutes; } offset = m.now - Date.now(); if (m.closed || !p || p.state !== 'in progress') load(); }).catch(() => {}); }, 20000);

if (token) load(); else showJoin();
</script>
</body>
